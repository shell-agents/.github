name: Bug report
description: Something is broken in an existing shell-agents repo.
title: "[Bug] <repo>: <short description>"
labels: ["bug"]
body:
  - type: input
    id: repo
    attributes:
      label: Which repo?
      placeholder: e.g. shell-agents/controller
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.3.1 or abc1234
    validations: { required: true }

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the agent.toml manifest and the audit log line if relevant.
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      render: bash
    validations: { required: true }

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS / kernel:
        - Shell:
        - Go / Node / etc. version:
